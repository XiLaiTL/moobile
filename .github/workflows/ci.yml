# CI —— 只跑"离线检查"（PLAN 的 C3）
#
# 为什么只有这些：其余几类验证需要本机资源，放进 CI 会变成永远红/永远跳过的噪声 ——
#   · Web 端到端（tools/verify_web.js、db_probe、sync_probe）：要 Metro 在 8081 + 本地后端；
#   · 真机（tools/verify_android.py）：要 Android 模拟器 + 装好的 APK；
#   · 发布后验证（tools/check_published.sh）：要"已经发出去的那一版"，属于发版流程。
# 这几类在本地一条命令跑：`bash tools/verify_all.sh --with-e2e`、`python3 tools/verify_android.py`。
#
# 这里跑的就是本地那个入口 `tools/verify_all.sh`。
# ⚠️ **项数会漂，别抄这个数** —— 现状一律看 `docs/STATUS.md`（唯一来源）。
#
# ⚠️ vendor 一致性与外部模块那两项需要网络（拉 pristine 制品、`moon add`）。
#
# ══════════════════════════════════════════════════════════════════════════════
# 2026-10-01：这个 workflow **第一次真正运行**，而它当时**永远不可能绿**。
#
# 它从 13:52 就躺在仓库里、计划上标着"✅ 已落地"，但那些提交一直没推出去 ——
# GitHub 只有在工作流文件进了远端才会跑它。一推上去，两次运行都 `failure`；
# 本机同一个命令却 15/15 全绿。真因是**它漏了"新克隆"配方里的第一步**：
#
#   ① `vendor/` 是 **gitignore 的生成物**（rabbita fork：`tools/vendor.lock` 的版本
#      + `tools/patches/*.patch` → `tools/vendor_sync.sh` 生成，见 `FORK.md` §0）。
#      新鲜克隆里**没有它** → `moon check` 报
#      `Cannot find import 'XiLaiTL/moobile/vendor/rabbita/vdom'` → 后面 8 条门连锁全红。
#      `CONTRIBUTING.md` §1 写着这一条（"重建第三方（新克隆 / 换版本）"），
#      **而 CI 每一次运行都是一个新克隆**。本机之所以看不出来，是因为 vendor 早就铺好了。
#   ② 模板三条门要**已安装**的 `node_modules` 里取 `react` 与 `moobile-host`
#      （`tools/verify_headless.mjs` 的 `pickNodeModules`），而这一步写着
#      `continue-on-error: true` —— 装失败也报 success。
#
# 复现与验证（本机）：新鲜克隆 → 4 通过 / 8 失败；补 `vendor_sync --apply` 后
# `moon check` 转绿、10 / 2 / 2，剩下 2 条正是 node_modules 缺失所致。
#
# 所以下面两处是**修的必要条件**，别退回去：
#   · 先 `vendor_sync.sh --apply` 再 `verify_all.sh`；
#   · npm 安装失败就是失败（`continue-on-error` 会把"装挂了"和"门红"之间的线索抹掉）。
# ══════════════════════════════════════════════════════════════════════════════

name: offline-checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon version
        run: moon version

      # ★ 新克隆的第一步：把 gitignore 的 `vendor/`（rabbita fork）生成出来。
      #   不跑这一步，`moon check` 连包都解不出来 —— 见文件头那段。
      - name: 重建 vendor（gitignore 的第三方 fork）
        run: bash tools/vendor_sync.sh --apply

      # 宿主 npm 包：`verify_all.sh` 里那两条门（能力注册表一致性 / 副本新鲜度）
      # 与模板那三条门都要它。**故意不写 `continue-on-error`** ——
      # 装了失败就要红：否则"门红"与"装挂了"分不开（2026-10-01 实测踩过）。
      - name: Install host deps
        run: cd examples/apps/todo-app/host && npm install --no-audit --no-fund

      - name: 一条命令跑完离线检查
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/gates.log"
          if bash tools/verify_all.sh 2>&1 | tee "$LOG"; then
            {
              echo "### 离线门：全绿"
              echo '```'
              grep -E '^(PASS|SKIP) ' "$LOG" || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ★ 失败时必须**自己说清为什么**。
          #
          # 为什么要有这一段（2026-10-01 被逼出来的）：修好 vendor 那一步之后 CI 仍然红，
          # 而**我去看日志时吃了个 403** —— 公开仓库的 job log 走 REST API 要认证
          # （`GET /actions/runs/<id>/logs` → 403），运行页又是 JS 渲染的、curl 取不到内容。
          # 于是"CI 红了"这句话对**任何非账号持有人**（含自动化代理）都是不可诊断的。
          # **annotation 不用认证**，所以就把它当出口：
          #     GET /repos/{owner}/{repo}/check-runs/{id}/annotations
          #
          # 顺序也有讲究：先把**门名**发出来（这是"哪条红了"的答案），再发**错误行**，最后才是尾巴。
          grep -E '^FAIL ' "$LOG" | head -10 | while IFS= read -r l; do
            echo "::error title=门失败::$l"
          done

          # ★ 12 行**不够**定位 —— 2026-10-01 实测：那次只看到一串 deprecated 警告，
          #   看不出到底哪个 error 让门红的。
          #
          # ★★ 收口时又学了一条，而且它改了做法：**真因根本不在尾巴上。**
          #   那次唯一那个 error（E3002 解析错误）落在更早的位置，尾巴上是它后面的警告 ——
          #   于是所有人都往"警告致红"的方向猜了一轮。
          #   所以 `verify_all.sh` 现在会**先打一段 `---- 错误行 ----`**（从门的完整日志里
          #   捞 `Error:` / `AssertionError:` 那类行，带 3 行上下文），下面这条 awk 就是把**它**发出来。
          #   **这才是"为什么红"的答案**；尾巴只作补充。顺序也照这个来：错误行在前，尾巴在后。
          awk '
            /---- 错误行（真因常常不在尾巴上）----/ { f = 1; n = 0; next }
            /^(PASS|FAIL|SKIP) /                   { f = 0 }
            /---- 末尾 12 行 ----/                  { f = 0 }
            f && NF && n < 12                       { print; n++ }
          ' "$LOG" | while IFS= read -r l; do
            echo "::error title=错误行::$(printf '%s' "$l" | sed 's/^ *//')"
          done

          # `verify_all.sh` 在每条失败的门后面跟着它日志的末尾 12 行（以 6 个空格缩进）。
          # 只取**第一条**失败的门的尾巴：annotation 有条数/体积上限，而"哪条先红"信息量最大。
          awk '
            /---- 末尾 12 行 ----/ { f = 1; n = 0; next }
            /^(PASS|FAIL|SKIP) /   { f = 0 }
            f && NF && n < 12       { print; n++ }
          ' "$LOG" | while IFS= read -r l; do
            echo "::error title=日志尾巴::$(printf '%s' "$l" | sed 's/^ *//')"
          done

          # ★ 顺手把**工具链版本**发出来：CI 装 `latest`，工作区钉 `DEV.md` 那一版 ——
          #   "本机绿、CI 红"最常见的原因就是这两代不一样；而 job log 读不到时，
          #   这一行是**唯一**能确认"我在本地复现的是不是同一代"的依据（2026-10-01 就靠它）。
          echo "::error title=工具链::$(moon version 2>&1 | head -1)"
          echo "::error title=node::$(node --version 2>&1 | head -1)"

          # ⚠️ 曾经这里还发过一条**装整份输出（末尾 12000 字符）**的 annotation，
          #   目的是"一眼看全"。**没用的，已删**：2026-10-01 实测那一条**根本没出现**
          #   （同一次运行另外 12 条都在）—— GitHub 对单条 annotation 的体积上限比 12000 小得多。
          #   记在这里，免得下一个人再试一次同样的"更全 = 更好"。

          {
            echo "### 离线门：失败"
            echo '```'
            grep -E '^(PASS|FAIL|SKIP) ' "$LOG" || true
            echo '```'
            echo "工具链：\`$(moon version 2>&1 | head -1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
